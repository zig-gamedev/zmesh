name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true
jobs:
  lint-and-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        zig-version: ["0.15.2", "0.16.0"]
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Verify Xcode
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Ensure Xcode Command Line Tools are available
        if: runner.os == 'macOS'
        run: |
          xcode-select --install || true
          sudo xcode-select -switch /Library/Developer/CommandLineTools || true
          sudo xcodebuild -license accept || true

          # Wait until xcodebuild becomes available after image updates
          for i in {1..30}; do
            if xcodebuild -version >/dev/null 2>&1; then
              xcrun --show-sdk-path
              break
            fi
            echo "Waiting for Xcode CLT to be ready..."
            sleep 10
          done
      - name: Install Zig
        uses: mlugg/setup-zig@v2
      - name: Check format
        continue-on-error: true
        run: zig fmt --check .
      - name: Build and run tests
        run: zig build test
